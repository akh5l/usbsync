name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-slim

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          mkdir release
          cp build/usbsync release/
          tar -czf usbsync-${{ github.ref_name }}-linux-x86_64.tar.gz -C release usbsync

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: usbsync-${{ github.ref_name }}-linux-x86_64.tar.gz
